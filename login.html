<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — админ-панель</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#100d12;color:#fff8e9;font:15px Arial,sans-serif;padding:20px}.box{width:min(100%,420px);background:#211820;border:1px solid #514568;border-radius:18px;padding:30px;box-shadow:0 20px 60px #0006}h1{font-size:28px;margin:0 0 8px}p{color:#c4bfd0;margin:0 0 22px}label{display:block;font-size:13px;margin:14px 0 7px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #59516a;background:#11111b;color:#fff;outline:none}button{width:100%;margin-top:22px;border:0;border-radius:9px;padding:14px;background:#d6ad62;color:#251b12;font-weight:bold;cursor:pointer}.error{background:#4b2529;color:#ffd8d8;padding:10px;border-radius:8px;font-size:13px;margin-bottom:14px}.brand{color:#d6ad62;font-size:12px;letter-spacing:2px;margin-bottom:18px}</style></head><body><form class="box" method="post" action="/login"><div class="brand">ЭКСПЕРИМЕНТАРИЙ / QUEST</div><h1>Админ-панель</h1><p>Войдите, чтобы управлять заявками.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<input type="hidden" name="next" value="{{ next }}"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Войти</button></form></body></html>
